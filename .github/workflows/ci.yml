name: CI

on:
  push:
    # branches:
    #   - develop
    #   - master
  pull_request:

jobs:
  # linux-ubuntu-20.04:
  #   runs-on: ubuntu-latest
  #   container: ubuntu:20.04
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Prepare
  #       env:
  #         DEBIAN_FRONTEND: noninteractive
  #       run: |
  #         apt update -qq
  #         apt install -y build-essential automake autoconf libtool pkg-config \
  #                        libssl-dev libcppunit-dev p11-kit
  #     - name: Build and test
  #       env:
  #         CXXFLAGS: -Werror
  #       run: |
  #         ./autogen.sh
